<body class="tx-body">
<header class="tx-top">
  <a class="tx-ib" id="homeBtn" href="./" aria-label="العودة إلى المكتبة" title="المكتبة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
  <div class="tx-title" id="title">…</div>
  <button class="tx-ib" id="fsDown" aria-label="تصغير الخط" title="تصغير الخط"><span class="tx-a">أ<small>−</small></span></button>
  <button class="tx-ib" id="fsUp" aria-label="تكبير الخط" title="تكبير الخط"><span class="tx-a big">أ<small>+</small></span></button>
  <button class="tx-ib" id="tocBtn" aria-label="الانتقال إلى صفحة" title="الانتقال إلى صفحة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
</header>

<main class="tx-main" id="main">
  <div class="tx-head">
    <div class="tx-kick" id="kick"></div>
    <h1 id="bookTitle"></h1>
    <div class="tx-author" id="author"></div>
    <div class="tx-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 8v5m0 3h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>
      <span>نسخة للقراءة بخط كبير. النص كما في الكتاب، وأرقام الصفحات مطابقة للكتاب المطبوع وفهرسه.</span>
    </div>
    <a class="tx-orig" id="origTop" href="#">عرض صفحات الكتاب الأصلية ←</a>
  </div>
  <div id="pages"><div class="tx-load">جارٍ تحميل النص…</div></div>
</main>

<div class="tx-bar" id="bar">
  <button class="tx-pg" id="pgBtn" aria-label="الانتقال إلى صفحة"><span id="pgNow">–</span> <small>من <span id="pgAll">–</span></small></button>
  <a class="tx-pdf" id="origBtn" href="#">الصفحة الأصلية</a>
</div>

<div class="tx-sheet" id="sheet" hidden>
  <div class="tx-sheet-in" role="dialog" aria-modal="true" aria-label="الانتقال إلى صفحة">
    <div class="tx-sheet-h"><b>الانتقال إلى صفحة</b><button class="tx-x" id="sheetX" aria-label="إغلاق">✕</button></div>
    <form class="tx-go" id="goForm"><input id="goIn" type="number" inputmode="numeric" placeholder="رقم الصفحة كما في الفهرس" aria-label="رقم الصفحة"><button>انتقال</button></form>
    <div class="tx-sec-h">العناوين</div>
    <ol class="tx-heads" id="heads"></ol>
  </div>
</div>

<script src="assets/common.js?v=42"></script>
<script type="module">
const { loadLibrary, store, ar, applyTheme } = window.Lib;
const $ = (id) => document.getElementById(id);
const P = new URLSearchParams(location.search);
const data = await loadLibrary();
const book = data.books.find((b) => b.id === P.get("id"));
if (!book || !book.text) { location.replace("read.html?" + P.toString()); await new Promise(() => {}); }
const site = data.site;
const libName = site.libraryName || site.title || "المكتبة";
document.title = book.title + " — " + libName;
$("title").textContent = book.title; $("bookTitle").textContent = book.title;
$("kick").textContent = book.category || "";
$("author").textContent = site.authorName || site.brandSub || "";
const KEY = "tx:" + location.pathname.replace(/[^/]*$/, "") + book.id;
// حجم الخط (يُحفظ في المتصفح)
const FS = [16, 18, 20, 22, 24, 27, 30, 34, 38];
let fi = +(store.get("tx-fs") ?? (innerWidth < 700 ? 4 : 3)); if (!(fi >= 0 && fi < FS.length)) fi = 4;
const setFs = () => { document.documentElement.style.setProperty("--tx-fs", FS[fi] + "px"); store.set("tx-fs", fi); $("fsDown").disabled = fi === 0; $("fsUp").disabled = fi === FS.length - 1; };
setFs();
$("fsUp").onclick = () => { const k = keep(); fi = Math.min(FS.length - 1, fi + 1); setFs(); restore(k); };
$("fsDown").onclick = () => { const k = keep(); fi = Math.max(0, fi - 1); setFs(); restore(k); };
// الحفاظ على الموضع عند تغيير الخط
function keep() { const s = curSec(); return s ? { id: s.id, r: (scrollY - s.offsetTop) / Math.max(1, s.offsetHeight) } : null; }
function restore(k) { if (!k) return; const s = $(k.id); if (s) scrollTo(0, s.offsetTop + k.r * s.offsetHeight); }

const T = await (await fetch(book.text + (book.text.includes("?") ? "&" : "?") + "v=" + (book.textV || 1))).json();
const pages = T.pages, OFF = +book.pageOffset || 0;
$("pgAll").textContent = ar(pages[pages.length - 1].n);
const frag = document.createDocumentFragment();
const heads = [];
pages.forEach((pg) => {
  const s = document.createElement("section"); s.className = "tx-p"; s.id = "p" + pg.n; s.dataset.n = pg.n; s.dataset.pdf = pg.pdf;
  s.innerHTML = '<div class="tx-mark"><span>صفحة ' + ar(pg.n) + "</span></div>" + '<div class="tx-c">' + pg.html + "</div>" +
    (pg.notes.length ? '<ol class="tx-fn">' + pg.notes.map((n, i) => "<li><b>(" + ar(i + 1) + ")</b> " + n + "</li>").join("") + "</ol>" : "");
  s.querySelectorAll("h2,h3,h4").forEach((h) => heads.push({ t: h.textContent.trim(), n: pg.n, el: h }));
  frag.appendChild(s);
});
$("pages").replaceChildren(frag);
// أرقام الحواشي بالأرقام العربية
document.querySelectorAll(".tx-c sup.fn").forEach((x) => (x.textContent = x.textContent.replace(/\d+/g, (d) => ar(+d))));
heads.forEach((h, i) => { const li = document.createElement("li"); const b = document.createElement("button"); b.innerHTML = "<span></span><small>" + ar(h.n) + "</small>"; b.firstChild.textContent = h.t; b.onclick = () => { close(); h.el.scrollIntoView({ block: "start" }); scrollBy(0, -70); }; li.appendChild(b); $("heads").appendChild(li); });

const secs = [...document.querySelectorAll(".tx-p")];
function curSec() { const y = scrollY + 90; let c = secs[0]; for (const s of secs) { if (s.offsetTop <= y) c = s; else break; } return c; }
function origUrl() { const s = curSec(); return "read.html?id=" + encodeURIComponent(book.id) + "&mode=pdf&p=" + (s ? s.dataset.pdf : 1); }
let raf = 0;
addEventListener("scroll", () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; const s = curSec(); if (s) { $("pgNow").textContent = "صفحة " + ar(+s.dataset.n); store.set(KEY, s.dataset.n); } }); }, { passive: true });
$("origBtn").onclick = $("origTop").onclick = (e) => { e.preventDefault(); location.href = origUrl(); };
function go(n) { const s = $("p" + n); if (!s) return false; s.scrollIntoView({ block: "start" }); scrollBy(0, -62); return true; }
const start = +P.get("n") || (P.get("p") ? (+P.get("p") - OFF) : 0) || +store.get(KEY) || 0;
if (start && start > pages[0].n) requestAnimationFrame(() => go(start)); else dispatchEvent(new Event("scroll"));
// لوحة الانتقال
const open = () => { $("sheet").hidden = false; $("goIn").value = ""; setTimeout(() => $("goIn").focus(), 60); };
const close = () => { $("sheet").hidden = true; };
$("tocBtn").onclick = $("pgBtn").onclick = open; $("sheetX").onclick = close;
$("sheet").onclick = (e) => { if (e.target === $("sheet")) close(); };
addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
$("goForm").onsubmit = (e) => { e.preventDefault(); const v = parseInt(String($("goIn").value).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10); if (go(v)) close(); else $("goIn").select(); };
</script>
</body>

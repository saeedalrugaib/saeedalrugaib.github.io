<script type="module">
const { loadLibrary, store, ar } = window.Lib;
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const [data, CV] = await Promise.all([loadLibrary(), fetch("data/cv.json?v=" + Date.now()).then((r) => r.json())]);
document.title = "السيرة الذاتية — " + CV.name;
// الخط
const FS = [15, 16, 17, 18, 20, 22, 24, 27];
let fi = +(store.get("cv-fs") ?? 3); if (!(fi >= 0 && fi < FS.length)) fi = 3;
const setFs = () => { document.documentElement.style.setProperty("--cv-fs", FS[fi] + "px"); store.set("cv-fs", fi); $("fsDown").disabled = !fi; $("fsUp").disabled = fi === FS.length - 1; };
setFs(); $("fsUp").onclick = () => { fi = Math.min(FS.length - 1, fi + 1); setFs(); }; $("fsDown").onclick = () => { fi = Math.max(0, fi - 1); setFs(); };
// الرأس
if (CV.photo) { const i = el("img"); i.src = CV.photo; i.alt = CV.name; $("ph").appendChild(i); }
$("nm").textContent = CV.name; $("rk").textContent = CV.rank; $("wk").textContent = CV.work;
$("ml").href = "mailto:" + CV.email; $("ml").querySelector("span").textContent = CV.email;
$("closing").textContent = CV.closing || "";
const count = (id) => { const t = CV.tabs.find((x) => x.id === id); return t ? t.sections.reduce((a, s) => a + s.groups.reduce((b, g) => b + g.items.length, 0), 0) : 0; };
const nBooks = data.books.filter((b) => b.category !== "السيرة الذاتية").length;
[[nBooks, "عملاً علمياً في المكتبة", "./#all"], [count("events"), "مشاركة علمية وأكاديمية", "#events"], [count("committees"), "لجنة ومجلساً", "#committees"], [count("teaching"), "إسهاماً في التدريس والإشراف والتحكيم", "#teaching"]].forEach(([n, l, h]) => {
  const a = el("a", "cv-st"); a.href = h; const b = el("b", "", ar(n)); a.appendChild(b); a.appendChild(el("span", "", l)); $("stats").appendChild(a); });
// الأيقونات
const IC = { user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0", briefcase: "M4 8h16v11H4zM9 8V5h6v3M4 13h16", users: "M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-6 9a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14a5.5 5.5 0 0 1 3 6", book: "M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 16V5M8 7h7", cap: "M2 9l10-5 10 5-10 5zm4 2v5c3 2 9 2 12 0v-5M22 9v6", mic: "M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 14 0M12 19v3", laptop: "M4 5h16v11H4zM2 19h20", spark: "M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z", heart: "M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" };
const svg = (k) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="' + IC[k] + '"/></svg>';
// القوائم
function list(items, timeline) {
  if (items.length && Array.isArray(items[0])) { // جدول
    const w = el("div", "cv-tbl"); const t = el("table"); t.innerHTML = "<thead><tr><th>م</th><th>اسم الدورة</th><th>مكانها</th><th>مدتها</th></tr></thead>";
    const tb = el("tbody"); items.forEach((r, i) => { const tr = el("tr"); [ar(i + 1), ...r].forEach((c) => tr.appendChild(el("td", "", c))); tb.appendChild(tr); }); t.appendChild(tb); w.appendChild(t); return w; }
  const ul = el("ul", timeline ? "cv-tl" : "cv-ul"); items.forEach((x) => ul.appendChild(el("li", "", x))); return ul;
}
const panes = $("panes");
CV.tabs.forEach((T, i) => {
  const b = el("button", "cv-tab"); b.type = "button"; b.setAttribute("role", "tab"); b.id = "t-" + T.id; b.setAttribute("aria-controls", "p-" + T.id);
  b.innerHTML = svg(T.icon); b.appendChild(el("span", "", T.t)); b.onclick = () => show(T.id, true); $("tabs").appendChild(b);
  const p = el("section", "cv-pane"); p.id = "p-" + T.id; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", b.id);
  const h = el("h2", "cv-ph2"); h.innerHTML = svg(T.icon); h.appendChild(el("span", "", T.t)); p.appendChild(h);
  if (T.summary) { const c = el("div", "cv-card cv-sum"); T.summary.forEach((x) => c.appendChild(el("p", "", x))); p.appendChild(c); }
  if (T.facts) { const g = el("dl", "cv-facts"); T.facts.forEach(([k, v]) => { const d = el("div"); d.appendChild(el("dt", "", k)); d.appendChild(el("dd", "", v)); g.appendChild(d); }); p.appendChild(g); }
  if (T.expertise) { const c = el("div", "cv-card"); c.appendChild(el("h3", "", "مجالات الخبرة")); const g = el("div", "cv-exp"); T.expertise.forEach((x) => { const [a, ...r] = x.split(":"); const d = el("div", "cv-ex"); d.appendChild(el("b", "", a.trim())); if (r.length) d.appendChild(el("span", "", r.join(":").trim())); g.appendChild(d); }); c.appendChild(g); p.appendChild(c); }
  T.sections.forEach((S) => { const c = el("div", "cv-card"); if (S.t !== T.t) c.appendChild(el("h3", "", S.t));
    S.groups.forEach((G) => { if (G.t) c.appendChild(el("h4", "", G.t.replace(/\s*\(اسم الدورة.*\)/, ""))); c.appendChild(list(G.items, T.timeline)); }); p.appendChild(c); });
  panes.appendChild(p);
});
function show(id, push) {
  if (!CV.tabs.some((t) => t.id === id)) id = CV.tabs[0].id;
  document.querySelectorAll(".cv-tab").forEach((b) => { const on = b.id === "t-" + id; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); if (on) b.scrollIntoView({ inline: "center", block: "nearest" }); });
  document.querySelectorAll(".cv-pane").forEach((p) => (p.hidden = p.id !== "p-" + id));
  if (push) { history.replaceState(null, "", "#" + id); const top = $("tabs").offsetTop - 56; if (scrollY > top) scrollTo({ top, behavior: "smooth" }); }
}
document.querySelectorAll('.cv-st[href^="#"]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); show(a.getAttribute("href").slice(1), true); }));
addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
